<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Children Welfare Dashboard</title>

  <style>/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: Arial, sans-serif;
    background-color: #F4E1C1;
    color: #333;
    text-align: center;
}

/* HEADER */
header {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 30px;
}

header p {
    font-size: 16px;
    margin-top: 5px;
}

/* NAVBAR */
nav {
    background-color: #D4AF37;
    text-align: center;
    padding: 10px;
}

nav a {
    margin: 10px;
    text-decoration: none;
    color: #000;
    font-weight: bold;
}

nav button {
    padding: 5px 10px;
    margin-left: 10px;
    background-color: #8E2C2C;
    color: white;
    border: none;
    cursor: pointer;
}

nav button:hover {
    background-color: #6f2222;
}

/* HERO SECTION */
.hero {
    text-align: center;
    padding: 40px 20px;
}

.hero h2 {
    margin-bottom: 10px;
}

/* CARDS */
.cards {
    display: flex;
    justify-content: space-around;
    padding: 20px;
}

.card {
    background-color: white;
    width: 25%;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
    text-align: center;
}

/* TABLES */
table {
    width: 90%;
    margin: auto;
    background-color: white;
    border-collapse: collapse;
}

th {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

/* FORMS */
form {
    max-width: 400px;
    margin: auto;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
}

label {
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 10px;
}

/* BUTTONS */
button {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
    border: none;
    width: 100%;
    cursor: pointer;
}

button:hover {
    background-color: #6f2222;
}

/* FOOTER */
footer {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
}
</style>
</head>
<body>
<h1 style="background: #D4AF37;"><img src="{{ url_for('static', filename='images/1B.webp') }}" alt="Govt of India" width="100px" height="100px">     Sakhi Saarthi<h1><br>
<h2><img src="{{ url_for('static', filename='images/1C.webp') }}" alt="child welfare" width="100px" height="100px">Children Welfare Services</h2>

<form onsubmit="return redirectChildService()">
  <label>Select Service:</label><br><br>

  <select id="childService" required>
    <option value="">-- Select Option --</option>
    <option value="A2image">Related Images</option>
    <option value="nutrition">Child Nutrition & Health</option>
    <option value="education">Education Support & Scholarships</option>
    <option value="abuse">Child Abuse & Labour Reporting</option>
  </select>

  <br><br>
  <button type="submit">Submit</button>
</form>

<script>
function redirectChildService() {

  const pages = {
    A2image:"A2image.html",
    nutrition: "nutrition.html",
    education: "education.html",
    abuse: "child_abuse.html"
  };

  const service = document.getElementById("childService").value;

  if (!pages[service]) {
    alert("Please select a valid option");
    return false;
  }

  window.location.href = pages[service];
  return false;
}
</script>

</body>
</html>
