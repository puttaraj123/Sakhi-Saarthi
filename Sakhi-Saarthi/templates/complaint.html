<!DOCTYPE html>
<html>
<head>
    <title>Report Complaint</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

   <style>/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: Arial, sans-serif;
    background-color: #F4E1C1;
    color: #333;
}

/* HEADER */
header {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 30px;
}

header p {
    font-size: 16px;
    margin-top: 5px;
}

/* NAVBAR */
nav {
    background-color: #D4AF37;
    text-align: center;
    padding: 10px;
}

nav a {
    margin: 10px;
    text-decoration: none;
    color: #000;
    font-weight: bold;
}

nav button {
    padding: 5px 10px;
    margin-left: 10px;
    background-color: #8E2C2C;
    color: white;
    border: none;
    cursor: pointer;
}

nav button:hover {
    background-color: #6f2222;
}

/* HERO SECTION */
.hero {
    text-align: center;
    padding: 40px 20px;
}

.hero h2 {
    margin-bottom: 10px;
}

/* CARDS */
.cards {
    display: flex;
    justify-content: space-around;
    padding: 20px;
}

.card {
    background-color: white;
    width: 25%;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
    text-align: center;
}

/* TABLES */
table {
    width: 90%;
    margin: auto;
    background-color: white;
    border-collapse: collapse;
}

th {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

/* FORMS */
form {
    max-width: 400px;
    margin: auto;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
}

label {
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 10px;
}

/* BUTTONS */
button {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
    border: none;
    width: 100%;
    cursor: pointer;
}

button:hover {
    background-color: #6f2222;
}

/* FOOTER */
footer {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
}
</style>

</head>
<body>

<header>
    <h1 id="title">SakhiSaarthi</h1>
    <p id="subtitle">Complaint & Help Desk</p>
</header>

<section class="hero">
    <h2 id="pageTitle">Report an Issue</h2>
    <p id="pageDesc">
        Submit complaints related to women or child welfare anonymously.
    </p>
</section>


<nav><button onclick="setLanguage('en')">English</button>
<button onclick="setLanguage('kn')">ಕನ್ನಡ</button>
</nav>

<section class="hero">
    <form>
        <label>Name (Optional)</label><br>
        <input type="text"><br><br>

        <label>Issue Type</label><br>
        <select>
            <option>Women Safety</option>
            <option>Child Welfare</option>
            <option>Scheme Issue</option>
        </select><br><br>

        <label>Description</label><br>
        <textarea rows="4"></textarea><br><br>

        <button type="submit">Submit Complaint</button>
    </form>
</section>

<footer>
    <p>SakhiSaarthi</p>
</footer>

<script>
function setLanguage(lang) {
    if (lang === "kn") {
        document.getElementById("title").innerText = "ಸಖಿ ಸಾರಥಿ";
        document.getElementById("subtitle").innerText =
            "ಮಹಿಳೆ ಮತ್ತು ಮಕ್ಕಳ ಕಲ್ಯಾಣ ಡಿಜಿಟಲ್ ವೇದಿಕೆ";

        document.getElementById("pageTitle").innerText =
            pageTitles.kn;

        document.getElementById("pageDesc").innerText =
            pageDescs.kn;
    } else {
        document.getElementById("title").innerText = "SakhiSaarthi";
        document.getElementById("subtitle").innerText =
            subtitles.en;

        document.getElementById("pageTitle").innerText =
            pageTitles.en;

        document.getElementById("pageDesc").innerText =
            pageDescs.en;
    }
}
</script>

</body>
</html>
