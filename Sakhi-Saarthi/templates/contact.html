<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | SakhiSaarthi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: Arial, sans-serif;
    background-color: #F4E1C1;
    color: #333;
}

/* HEADER */
header {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 30px;
}

header p {
    font-size: 16px;
    margin-top: 5px;
}

/* NAVBAR */
nav {
    background-color: #D4AF37;
    text-align: center;
    padding: 10px;
}

nav a {
    margin: 10px;
    text-decoration: none;
    color: #000;
    font-weight: bold;
}

nav button {
    padding: 5px 10px;
    margin-left: 10px;
    background-color: #8E2C2C;
    color: white;
    border: none;
    cursor: pointer;
}

nav button:hover {
    background-color: #6f2222;
}

/* HERO SECTION */
.hero {
    text-align: center;
    padding: 40px 20px;
}

.hero h2 {
    margin-bottom: 10px;
}

/* CARDS */
.cards {
    display: flex;
    justify-content: space-around;
    padding: 20px;
}

.card {
    background-color: white;
    width: 25%;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
    text-align: center;
}

/* TABLES */
table {
    width: 90%;
    margin: auto;
    background-color: white;
    border-collapse: collapse;
}

th {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

/* FORMS */
form {
    max-width: 400px;
    margin: auto;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
}

label {
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 10px;
}

/* BUTTONS */
button {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
    border: none;
    width: 100%;
    cursor: pointer;
}

button:hover {
    background-color: #6f2222;
}

/* FOOTER */
footer {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
}
</style>
</head>
<body>

<header>
    <h1 id="title">SakhiSaarthi</h1>
    <p id="subtitle">Contact & Helplines</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="women.html">Women</a>
    <a href="child.html">Child</a>
    <a href="about.html">About</a>
    <a href="schemes.html">Schemes</a>
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('kn')">ಕನ್ನಡ</button>
</nav>

<section class="hero">
    <h2 id="pageTitle">Emergency Contacts</h2>
    <p id="pageDesc">
        Important helpline numbers and support services for women and children.
    </p>

    <ul>
        <li>📞 Women Helpline – 1091</li>
        <li>📞 Child Helpline – 1098</li>
        <li>🚨 Emergency – 112</li>
    </ul>
</section>

<script>
const subtitles = {
    en: "Contact & Helplines",
    kn: "ಸಂಪರ್ಕ ಮತ್ತು ಸಹಾಯವಾಣಿ"
};

const pageTitles = {
    en: "Emergency Contacts",
    kn: "ತುರ್ತು ಸಂಪರ್ಕ ಸಂಖ್ಯೆಗಳು"
};

const pageDescs = {
    en: "Important helpline numbers and support services for women and children.",
    kn: "ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳಿಗಾಗಿ ಪ್ರಮುಖ ಸಹಾಯವಾಣಿ ಸಂಖ್ಯೆಗಳು ಮತ್ತು ಬೆಂಬಲ ಸೇವೆಗಳು."
};

function setLanguage(lang) {
    document.getElementById("title").innerText = lang === "kn" ? "ಸಖಿ ಸಾರಥಿ" : "SakhiSaarthi";
    document.getElementById("subtitle").innerText = subtitles[lang];
    document.getElementById("pageTitle").innerText = pageTitles[lang];
    document.getElementById("pageDesc").innerText = pageDescs[lang];
}
</script>

<footer>
    <p>© 2026 SakhiSaarthi</p>
</footer>

</body>
</html>
