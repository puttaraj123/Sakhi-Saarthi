<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Women Support Dashboard</title>

 <style>/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: Arial, sans-serif;
    background-color: #F4E1C1;
    color: #333;
}

/* HEADER */
header {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 30px;
}

header p {
    font-size: 16px;
    margin-top: 5px;
}

/* NAVBAR */
nav {
    background-color: #D4AF37;
    text-align: center;
    padding: 10px;
}

nav a {
    margin: 10px;
    text-decoration: none;
    color: #000;
    font-weight: bold;
}

nav button {
    padding: 5px 10px;
    margin-left: 10px;
    background-color: #8E2C2C;
    color: white;
    border: none;
    cursor: pointer;
}

nav button:hover {
    background-color: #6f2222;
}

/* HERO SECTION */
.hero {
    text-align: center;
    padding: 40px 20px;
}

.hero h2 {
    margin-bottom: 10px;
}

/* CARDS */
.cards {
    display: flex;
    justify-content: space-around;
    padding: 20px;
}

.card {
    background-color: white;
    width: 25%;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
    text-align: center;
}

/* TABLES */
table {
    width: 90%;
    margin: auto;
    background-color: white;
    border-collapse: collapse;
}

th {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

/* FORMS */
form {
    max-width: 400px;
    margin: auto;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
}

label {
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 10px;
}

/* BUTTONS */
button {
    background-color: #8E2C2C;
    color: white;
    padding: 10px;
    border: none;
    width: 100%;
    cursor: pointer;
}

button:hover {
    background-color: #6f2222;
}

/* FOOTER */
footer {
    background-color: #8E2C2C;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
}
</style>
</head>
<body>
<h1 style="text-align:center; background: #8E2C2C;"><img src="{{ url_for('static', filename='images/1B.webp') }}" alt="WCDS" width="100px" height="100px">      Sakhi-Saarthi</h1><br>
<h1 style="background:#D4AF37;"><marquee>an Integrated Women & Child Welfare Support Portal</marquee><br></h1>
<h5 style="text-align:center;">One Platform Every Support</h5>

<br>
<br>
<br>
<br>
<h2 style="text-align:center;"><img src="{{ url_for('static', filename='images/2A.webp') }}" alt="WCDS" width="100px" height="100px">Women Support Services</h2>

<form onsubmit="return redirectService()">
  <label for="service">Select Service:</label><br><br>

  <select id="service" required>
    <option value="">-- Select Option --</option>
    <option value="A1image">Related Images</option>
    <option value="womenschemes">Government Schemes</option>
    <option value="eligibility">Eligibility Schemes</option>
    <option value="helplines">Women Safety Helplines</option>
    <option value="rights">Legal Rights</option>
  </select>

  <br><br>
  <button type="submit">Submit</button>
</form>

<script>
function redirectService() {

  // mapping select values to pages
  const pages = {
    A1image:"A1image.html",
    womenschemes: "womenschemes.html",
    eligibility: "eligibility.html",
    helplines: "helplines.html",
    rights: "legal_rights.html"
  };

  // get selected value
  const service = document.getElementById("service").value;

  // safety check (prevents undefined error)
  if (!pages[service]) {
    alert("Please select a valid service");
    return false;
  }

  // redirect
  window.location.href = pages[service];
  return false; // stop form reload
}
</script>

</body>
</html>
